<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket AI</title>
  <meta name="description" content="Winter Pocket Assistant and Python Trail.">
  <meta name="theme-color" content="#0b1520">
  <style>
    :root {
      --bg: #0b1520;
      --card: #132333;
      --card-border: rgba(186, 214, 235, 0.14);
      --text: #e8f1f7;
      --muted: #9fb3c4;
      --accent: #8ec8e8;
      --accent-2: #c9e6a6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 50% -80px, #1b3a52 0%, transparent 70%),
        var(--bg);
      min-height: 100vh;
      padding: 48px 20px 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main { width: 100%; max-width: 560px; }
    h1 {
      font: 600 34px/1.15 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }
    .lead { color: var(--muted); margin: 0 0 28px; }
    .cards { display: grid; gap: 14px; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 22px;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    a.card:hover, a.card:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(142, 200, 232, 0.45);
      background: #173044;
      outline: none;
    }
    .kicker {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 6px;
    }
    .card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
    .card p { margin: 0; color: var(--muted); }
    .go { margin-top: 14px; color: var(--accent-2); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Pocket AI</h1>
    <p class="lead">Two apps, both on this site.</p>
    <div class="cards">
      <a class="card" href="pocket-assistant/winter/">
        <p class="kicker">Assistant</p>
        <h2>Winter Pocket Assistant</h2>
        <p>A private everyday assistant you can use in the browser.</p>
        <p class="go">Open &rarr;</p>
      </a>
      <a class="card" href="python-trail/">
        <p class="kicker">Learn</p>
        <h2>Python Trail</h2>
        <p>Learn Python and work through lessons with a friend.</p>
        <p class="go">Open &rarr;</p>
      </a>
    </div>
  </main>
  <script>
    (function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) {
            return k.indexOf("pocketai-") === 0;
          }).map(function (k) { return caches.delete(k); }));
        }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
